<svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle (golden outline) -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#C4AF8F" stroke-width="2.5"/>
  
  <!-- Bot body (rounded rectangle, cream colored) -->
  <rect x="60" y="50" width="80" height="85" rx="20" fill="#E8DCC8"/>
  
  <!-- Head circle -->
  <circle cx="100" cy="70" r="28" fill="#E8DCC8" stroke="#C4AF8F" stroke-width="1.5"/>
  
  <!-- Display screen (black) -->
  <rect x="75" y="50" width="50" height="42" rx="12" fill="#1a1a1a"/>
  
  <!-- Closed happy eyes -->
  <path d="M 85 68 Q 85 72 88 72 Q 91 72 91 68" fill="none" stroke="#C4AF8F" stroke-width="2" stroke-linecap="round"/>
  <path d="M 109 68 Q 109 72 112 72 Q 115 72 115 68" fill="none" stroke="#C4AF8F" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Slight smile -->
  <path d="M 90 78 Q 100 82 110 78" fill="none" stroke="#C4AF8F" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Antenna/stem at top -->
  <line x1="100" y1="42" x2="100" y2="25" stroke="#C4AF8F" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="100" cy="20" r="4" fill="#F4D9AE"/>
  
  <!-- Headphones left -->
  <g stroke="#C4AF8F" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M 72 60 Q 65 60 63 70"/>
    <circle cx="58" cy="78" r="6" fill="none"/>
  </g>
  
  <!-- Headphones right -->
  <g stroke="#C4AF8F" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M 128 60 Q 135 60 137 70"/>
    <circle cx="142" cy="78" r="6" fill="none"/>
  </g>
  
  <!-- Heart in center chest -->
  <path d="M 100 110 L 107 117 L 100 124 L 93 117 Z" fill="#E8A76B" opacity="0.9"/>
  
  <!-- Curved petal/leaf shapes on bottom left and right -->
  <!-- Left petal -->
  <path d="M 65 130 Q 55 140 58 155 Q 60 145 72 140 Z" fill="#C4AF8F" opacity="0.8"/>
  
  <!-- Right petal -->
  <path d="M 135 130 Q 145 140 142 155 Q 140 145 128 140 Z" fill="#C4AF8F" opacity="0.8"/>
  
  <!-- Center bottom lotus-like shape -->
  <ellipse cx="100" cy="145" rx="12" ry="18" fill="#E8DCC8"/>
  
  <!-- Decorative circle around logo (outer) -->
  <circle cx="100" cy="100" r="102" fill="none" stroke="#C4AF8F" stroke-width="0.8" opacity="0.5"/>
</svg>